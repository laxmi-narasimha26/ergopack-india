<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benz Packaging - Professional Signature</title>
</head>

<body style="margin: 0; padding: 20px; font-family: Arial, Helvetica, sans-serif; background-color: #ffffff;">

    <!-- 
    USAGE INSTRUCTIONS:
    1. Open in Browser.
    2. Select EVERYTHING inside the border below (Ctrl+A or drag select).
    3. Copy (Ctrl+C).
    4. Paste into Gmail/Outlook Signature settings.
    -->

    <table cellpadding="0" cellspacing="0" border="0"
        style="background-color: #ffffff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #333333;">
        <tr>
            <!-- LOGO COLUMN -->
            <td style="vertical-align: top; padding-right: 25px; border-right: 2px solid #5cb85c;">
                <!-- Replace 'benz-packaging.png' with your live hosted URL for email use -->
                <img src="benz-packaging.png" alt="Benz Packaging" width="120"
                    style="display: block; width: 120px; height: auto; border-radius: 4px;">
            </td>

            <!-- CONTENT COLUMN -->
            <td style="vertical-align: top; padding-left: 25px;">
                <table cellpadding="0" cellspacing="0" border="0">
                    <!-- BRAND NAME -->
                    <tr>
                        <td
                            style="font-size: 24px; font-weight: 800; color: #1e3a8a; letter-spacing: 0.5px; line-height: 1.2; text-transform: uppercase;">
                            BENZ PACKAGING
                        </td>
                    </tr>

                    <!-- TAGLINE -->
                    <tr>
                        <td
                            style="font-size: 14px; font-style: italic; font-weight: 600; color: #5cb85c; padding-bottom: 5px; letter-spacing: 0.5px;">
                            Protection Before Perfection
                        </td>
                    </tr>

                    <!-- DIVIDER LINE -->
                    <tr>
                        <td style="padding-top: 10px; padding-bottom: 15px;">
                            <div style="height: 1px; background-color: #e5e5e5; width: 100%;"></div>
                        </td>
                    </tr>

                    <!-- FESTIVE GREETING (No Emojis) -->
                    <tr>
                        <td style="font-family: 'Georgia', serif; font-size: 16px; color: #444444; line-height: 1.5;">
                            <span style="display: block; margin-bottom: 4px;">Wishes you a</span>
                            <span style="font-size: 20px; color: #b8860b; font-weight: bold; font-style: italic;">Merry
                                Christmas</span>
                            <span style="display: block; margin-top: 2px;">& a Happy New Year 2025</span>
                        </td>
                    </tr>

                    <!-- WEBSITE LINK (Subtle) -->
                    <tr>
                        <td style="padding-top: 15px; font-size: 12px;">
                            <a href="https://www.benzpackaging.com"
                                style="color: #999999; text-decoration: none; border-bottom: 1px dotted #999999;">www.benzpackaging.com</a>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>

</html>
