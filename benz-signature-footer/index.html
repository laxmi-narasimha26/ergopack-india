<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benz Packaging - Premium Signature</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Montserrat', sans-serif;
        }

        .signature-container {
            width: 600px;
            height: 180px;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(212, 175, 55, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* Animated gradient border */
        .signature-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg,
                    transparent,
                    #d4af37,
                    #f4d03f,
                    #d4af37,
                    transparent);
            background-size: 200% 100%;
            animation: shimmerBorder 3s ease-in-out infinite;
        }

        @keyframes shimmerBorder {

            0%,
            100% {
                background-position: -200% 0;
            }

            50% {
                background-position: 200% 0;
            }
        }

        /* Floating particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.8), transparent);
            border-radius: 50%;
            animation: floatParticle 8s ease-in-out infinite;
        }

        .particle:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            left: 25%;
            animation-delay: 1s;
        }

        .particle:nth-child(3) {
            left: 45%;
            animation-delay: 2s;
        }

        .particle:nth-child(4) {
            left: 65%;
            animation-delay: 3s;
        }

        .particle:nth-child(5) {
            left: 85%;
            animation-delay: 4s;
        }

        @keyframes floatParticle {

            0%,
            100% {
                transform: translateY(180px) scale(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
                transform: translateY(140px) scale(1);
            }

            80% {
                opacity: 0.5;
                transform: translateY(20px) scale(0.5);
            }
        }

        .content {
            position: relative;
            z-index: 1;
            padding: 25px 35px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 50%, #d4af37 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            }

            50% {
                box-shadow: 0 0 35px rgba(212, 175, 55, 0.6);
            }
        }

        .logo-icon svg {
            width: 30px;
            height: 30px;
            fill: #0d1117;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .company-name {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 30%, #fff5cc 50%, #f4d03f 70%, #d4af37 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmerText 4s linear infinite;
            letter-spacing: 2px;
        }

        @keyframes shimmerText {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        .tagline {
            font-size: 11px;
            color: rgba(212, 175, 55, 0.7);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 4px;
            font-weight: 400;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(212, 175, 55, 0.3) 20%,
                    rgba(212, 175, 55, 0.5) 50%,
                    rgba(212, 175, 55, 0.3) 80%,
                    transparent 100%);
            margin: 12px 0;
        }

        .contact-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .contact-items {
            display: flex;
            gap: 25px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            color: #d4af37;
        }

        .contact-item svg {
            width: 14px;
            height: 14px;
            fill: #d4af37;
            opacity: 0.8;
        }

        .social-icons {
            display: flex;
            gap: 12px;
        }

        .social-icon {
            width: 28px;
            height: 28px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .social-icon:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(212, 175, 55, 0.6);
            transform: translateY(-2px);
        }

        .social-icon svg {
            width: 14px;
            height: 14px;
            fill: #d4af37;
        }

        /* Ambient light effect */
        .ambient-light {
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15), transparent 70%);
            border-radius: 50%;
            animation: ambientMove 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes ambientMove {

            0%,
            100% {
                top: -50px;
                left: -50px;
                opacity: 0.5;
            }

            25% {
                top: 50%;
                left: 30%;
                opacity: 0.8;
            }

            50% {
                top: -30px;
                left: 70%;
                opacity: 0.5;
            }

            75% {
                top: 60%;
                left: 50%;
                opacity: 0.7;
            }
        }

        /* Corner accents */
        .corner-accent {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            pointer-events: none;
        }

        .corner-accent.top-right {
            top: 10px;
            right: 10px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 8px 0 0;
        }

        .corner-accent.bottom-left {
            bottom: 10px;
            left: 10px;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 8px;
        }
    </style>
</head>

<body>

    <script>
        // Add subtle mouse tracking for ambient light
        const container = document.querySelector('.signature-container');
        const ambientLight = document.querySelector('.ambient-light');

        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left - 75;
            const y = e.clientY - rect.top - 75;
            ambientLight.style.left = x + 'px';
            ambientLight.style.top = y + 'px';
            ambientLight.style.animation = 'none';
        });

        container.addEventListener('mouseleave', () => {
            ambientLight.style.animation = 'ambientMove 8s ease-in-out infinite';
        });
    </script>
