<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>V1 - Teal Bleed Premium</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@300;500;700&display=swap"
        rel="stylesheet">
</head>

<body style="margin: 0; padding: 30px; background: #1a1a2e; font-family: Arial, sans-serif;">

    <!-- FULL BLEED TEAL SIGNATURE -->
    <table cellpadding="0" cellspacing="0" border="0"
        style="width: 680px; background: linear-gradient(135deg, #0d9488 0%, #14b8a6 50%, #2dd4bf 100%);">
        <tr>
            <td style="padding: 22px 30px;">
                <table cellpadding="0" cellspacing="0" border="0" width="100%">
                    <tr>
                        <!-- Logo with white circle background -->
                        <td style="width: 70px; vertical-align: middle;">
                            <div
                                style="width: 60px; height: 60px; background: rgba(255,255,255,0.95); border-radius: 50%; display: inline-block; text-align: center; line-height: 60px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                                <img src="../benz-packaging.png" alt="Benz" width="45"
                                    style="display: inline-block; vertical-align: middle;">
                            </div>
                        </td>
                        <!-- Brand Text -->
                        <td style="padding-left: 20px; vertical-align: middle;">
                            <div
                                style="font-family: 'Playfair Display', Georgia, serif; font-size: 22px; font-weight: 700; color: #ffffff; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.15);">
                                BENZ PACKAGING</div>
                            <div
                                style="font-family: 'Montserrat', Arial, sans-serif; font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.85); letter-spacing: 2px; margin-top: 3px;">
                                PROTECTION BEFORE PERFECTION</div>
                        </td>
                        <!-- Festive Message with decorative elements -->
                        <td style="text-align: right; vertical-align: middle;">
                            <div
                                style="font-family: 'Montserrat', Arial, sans-serif; font-size: 9px; color: rgba(255,255,255,0.7); letter-spacing: 1px;">
                                WISHING YOU A</div>
                            <div
                                style="font-family: 'Playfair Display', Georgia, serif; font-size: 20px; font-weight: 600; color: #ffffff; margin: 4px 0; text-shadow: 0 2px 8px rgba(0,0,0,0.2);">
                                ✦ Merry Christmas ✦
                            </div>
                            <div
                                style="font-family: 'Montserrat', Arial, sans-serif; font-size: 11px; color: #ffffff; font-weight: 700; letter-spacing: 3px;">
                                &amp; HAPPY NEW YEAR 2025
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>

</html>
