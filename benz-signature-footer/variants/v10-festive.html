<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body style="margin:0;padding:0;font-family:'DM Sans',Arial,sans-serif;">
    <table cellpadding="0" cellspacing="0" border="0"
        style="max-width:700px;background:#fff;border-radius:4px;overflow:hidden;">
        <tr>
            <td style="background:linear-gradient(90deg,#c41e3a 0%,#c41e3a 4px,transparent 4px);padding:12px 25px;">
                <table cellpadding="0" cellspacing="0" border="0" width="100%">
                    <tr>
                        <td style="width:45px;vertical-align:middle;">
                            <img src="https://ergopack.in/benz-logo.png" alt="Benz" style="height:36px;display:block;">
                        </td>
                        <td style="vertical-align:middle;padding-left:12px;">
                            <span style="font-size:14px;font-weight:600;color:#1a3a5c;">Benz Packaging</span>
                            <span style="font-size:10px;color:#2d5016;display:block;">Protection Before
                                Perfection</span>
                        </td>
                        <td style="vertical-align:middle;text-align:right;">
                            <span style="font-size:12px;color:#c41e3a;">★</span>
                            <span style="font-size:12px;color:#333;margin:0 8px;">Merry Christmas & Happy New Year
                                2025</span>
                            <span style="font-size:12px;color:#2d5016;">★</span>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
