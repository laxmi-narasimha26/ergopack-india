<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>V2 - Minimalist Banner</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body style="margin: 0; padding: 30px; background: #f5f5f5; font-family: Arial, sans-serif;">

    <table cellpadding="0" cellspacing="0" border="0" style="width: 650px; background: #ffffff;">
        <tr>
            <td style="padding: 20px 30px; border-left: 4px solid #2d8a5e;">
                <table cellpadding="0" cellspacing="0" border="0" width="100%">
                    <tr>
                        <td style="width: 55px; vertical-align: middle;">
                            <img src="../benz-packaging.png" alt="Benz" width="50" style="display: block;">
                        </td>
                        <td style="padding-left: 18px; vertical-align: middle;">
                            <span
                                style="font-family: 'Montserrat', Arial, sans-serif; font-size: 11px; font-weight: 700; color: #1a365d; letter-spacing: 3px;">BENZ
                                PACKAGING</span>
                            <span style="color: #ccc; margin: 0 10px;">|</span>
                            <span
                                style="font-family: 'Montserrat', Arial, sans-serif; font-size: 10px; font-weight: 300; color: #2d8a5e; letter-spacing: 1px;">Protection
                                Before Perfection</span>
                        </td>
                        <td style="text-align: right; vertical-align: middle;">
                            <span
                                style="font-family: 'Montserrat', Arial, sans-serif; font-size: 13px; font-weight: 500; color: #333;">
                                ★ Merry Christmas &amp; Happy New Year 2025 ★
                            </span>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>

</html>
