<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>V2 - Navy & Teal Split</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Raleway:wght@400;600&display=swap"
        rel="stylesheet">
</head>

<body style="margin: 0; padding: 30px; background: #1a1a2e; font-family: Arial, sans-serif;">

    <!-- SPLIT DESIGN: Navy Left, Teal Right -->
    <table cellpadding="0" cellspacing="0" border="0" style="width: 680px;">
        <tr>
            <!-- Navy Section -->
            <td
                style="width: 45%; background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%); padding: 20px 25px; vertical-align: middle;">
                <table cellpadding="0" cellspacing="0" border="0">
                    <tr>
                        <td style="width: 55px; vertical-align: middle;">
                            <img src="../benz-packaging.png" alt="Benz" width="50"
                                style="display: block; border-radius: 6px;">
                        </td>
                        <td style="padding-left: 15px; vertical-align: middle;">
                            <div
                                style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 18px; font-weight: 700; color: #2dd4bf; letter-spacing: 1px;">
                                BENZ</div>
                            <div
                                style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 14px; font-weight: 500; color: #ffffff;">
                                PACKAGING</div>
                            <div
                                style="font-family: 'Raleway', Arial, sans-serif; font-size: 8px; color: rgba(255,255,255,0.6); letter-spacing: 1px; margin-top: 4px;">
                                Protection Before Perfection</div>
                        </td>
                    </tr>
                </table>
            </td>
            <!-- Teal Section -->
            <td
                style="width: 55%; background: linear-gradient(135deg, #14b8a6 0%, #2dd4bf 100%); padding: 20px 25px; vertical-align: middle; text-align: center;">
                <div
                    style="font-family: 'Raleway', Arial, sans-serif; font-size: 9px; color: rgba(255,255,255,0.8); letter-spacing: 2px;">
                    ❄ SEASON'S GREETINGS ❄</div>
                <div
                    style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; font-weight: 700; color: #ffffff; margin: 6px 0;">
                    Merry Christmas</div>
                <div
                    style="font-family: 'Raleway', Arial, sans-serif; font-size: 12px; color: #0f172a; font-weight: 600; letter-spacing: 2px;">
                    &amp; Happy New Year 2025</div>
            </td>
        </tr>
    </table>

</body>

</html>
