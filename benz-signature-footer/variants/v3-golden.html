<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>V3 - Golden Teal Luxe</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Josefin+Sans:wght@300;600&display=swap"
        rel="stylesheet">
</head>

<body style="margin: 0; padding: 30px; background: #1a1a2e; font-family: Arial, sans-serif;">

    <!-- LUXURY: Teal with Gold Accents -->
    <table cellpadding="0" cellspacing="0" border="0" style="width: 680px; background: #0d9488;">
        <!-- Gold top accent -->
        <tr>
            <td
                style="height: 3px; background: linear-gradient(90deg, transparent 10%, #d4af37 30%, #f4e4a6 50%, #d4af37 70%, transparent 90%);">
            </td>
        </tr>
        <tr>
            <td style="padding: 18px 35px;">
                <table cellpadding="0" cellspacing="0" border="0" width="100%">
                    <tr>
                        <td style="width: 65px; vertical-align: middle;">
                            <div
                                style="border: 2px solid #d4af37; padding: 6px; display: inline-block; background: rgba(255,255,255,0.1);">
                                <img src="../benz-packaging.png" alt="Benz" width="48" style="display: block;">
                            </div>
                        </td>
                        <td
                            style="padding: 0 25px; vertical-align: middle; border-left: 1px solid rgba(212,175,55,0.4); border-right: 1px solid rgba(212,175,55,0.4);">
                            <div
                                style="font-family: 'Cinzel', Georgia, serif; font-size: 18px; font-weight: 700; color: #ffffff; letter-spacing: 3px;">
                                BENZ PACKAGING</div>
                            <div
                                style="font-family: 'Josefin Sans', Arial, sans-serif; font-size: 10px; font-weight: 300; color: #d4af37; letter-spacing: 2px; margin-top: 3px;">
                                ✦ Protection Before Perfection ✦</div>
                        </td>
                        <td style="text-align: right; vertical-align: middle;">
                            <div
                                style="font-family: 'Cinzel', Georgia, serif; font-size: 18px; font-weight: 600; color: #d4af37;">
                                Merry Christmas</div>
                            <div
                                style="font-family: 'Josefin Sans', Arial, sans-serif; font-size: 11px; color: #ffffff; margin-top: 4px;">
                                &amp; Happy New Year</div>
                            <div
                                style="font-family: 'Cinzel', Georgia, serif; font-size: 16px; font-weight: 700; color: #d4af37; letter-spacing: 4px; margin-top: 2px;">
                                2025</div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <!-- Gold bottom accent -->
        <tr>
            <td
                style="height: 3px; background: linear-gradient(90deg, transparent 10%, #d4af37 30%, #f4e4a6 50%, #d4af37 70%, transparent 90%);">
            </td>
        </tr>
    </table>

</body>

</html>
