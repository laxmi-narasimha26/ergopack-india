<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>V4 - Executive Power</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body style="margin: 0; padding: 30px; background: #f5f5f5; font-family: Arial, sans-serif;">

    <table cellpadding="0" cellspacing="0" border="0"
        style="width: 650px; background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
        <tr>
            <td style="width: 5px; background: linear-gradient(to bottom, #1a365d, #2d5a8a);"></td>
            <td style="padding: 18px 25px;">
                <table cellpadding="0" cellspacing="0" border="0" width="100%">
                    <tr>
                        <td style="width: 55px; vertical-align: middle;">
                            <img src="../benz-packaging.png" alt="Benz" width="50" style="display: block;">
                        </td>
                        <td
                            style="padding-left: 18px; vertical-align: middle; border-right: 1px solid #eee; padding-right: 20px;">
                            <div
                                style="font-family: 'Inter', Arial, sans-serif; font-size: 16px; font-weight: 800; color: #1a365d;">
                                BENZ PACKAGING</div>
                            <div
                                style="font-family: 'Inter', Arial, sans-serif; font-size: 9px; font-weight: 600; color: #2d8a5e; letter-spacing: 1px; margin-top: 2px;">
                                PROTECTION BEFORE PERFECTION</div>
                        </td>
                        <td style="padding-left: 20px; text-align: center; vertical-align: middle;">
                            <div
                                style="font-family: 'Inter', Arial, sans-serif; font-size: 14px; font-weight: 600; color: #333;">
                                Merry Christmas &amp; Happy New Year
                            </div>
                            <div
                                style="display: inline-block; margin-top: 5px; padding: 3px 12px; background: #1a365d; color: #fff; font-family: 'Inter', Arial, sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 2px;">
                                2025</div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>

</html>
