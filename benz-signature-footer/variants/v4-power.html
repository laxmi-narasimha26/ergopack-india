<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>V4 - Navy Power</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@300;500;700&display=swap"
        rel="stylesheet">
</head>

<body style="margin: 0; padding: 30px; background: #1a1a2e; font-family: Arial, sans-serif;">

    <!-- BOLD NAVY with Teal Accent Bar -->
    <table cellpadding="0" cellspacing="0" border="0"
        style="width: 680px; background: linear-gradient(to right, #0f172a 0%, #1e3a5f 100%);">
        <tr>
            <!-- Teal Accent Bar -->
            <td style="width: 8px; background: linear-gradient(to bottom, #2dd4bf, #14b8a6, #0d9488);"></td>
            <td style="padding: 20px 30px;">
                <table cellpadding="0" cellspacing="0" border="0" width="100%">
                    <tr>
                        <td style="width: 60px; vertical-align: middle;">
                            <img src="../benz-packaging.png" alt="Benz" width="55" style="display: block;">
                        </td>
                        <td style="padding-left: 20px; vertical-align: middle;">
                            <div
                                style="font-family: 'Bebas Neue', Arial, sans-serif; font-size: 28px; color: #2dd4bf; letter-spacing: 4px; line-height: 1;">
                                BENZ PACKAGING</div>
                            <div
                                style="font-family: 'Work Sans', Arial, sans-serif; font-size: 9px; font-weight: 500; color: rgba(255,255,255,0.7); letter-spacing: 2px; margin-top: 4px;">
                                PROTECTION BEFORE PERFECTION</div>
                        </td>
                        <td style="text-align: right; vertical-align: middle;">
                            <div
                                style="font-family: 'Work Sans', Arial, sans-serif; font-size: 15px; font-weight: 700; color: #ffffff;">
                                Merry Christmas &amp; Happy New Year
                            </div>
                            <div
                                style="display: inline-block; margin-top: 6px; padding: 5px 18px; background: #2dd4bf; font-family: 'Bebas Neue', Arial, sans-serif; font-size: 18px; color: #0f172a; letter-spacing: 3px;">
                                2025</div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>

</html>
