<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>V5 - Script Teal Dream</title>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Quicksand:wght@400;600;700&display=swap"
        rel="stylesheet">
</head>

<body style="margin: 0; padding: 30px; background: #1a1a2e; font-family: Arial, sans-serif;">

    <!-- DREAMY TEAL with Script Accent -->
    <table cellpadding="0" cellspacing="0" border="0"
        style="width: 680px; background: linear-gradient(135deg, #134e4a 0%, #0d9488 40%, #14b8a6 100%);">
        <tr>
            <td style="padding: 22px 35px;">
                <table cellpadding="0" cellspacing="0" border="0" width="100%">
                    <tr>
                        <td style="width: 58px; vertical-align: middle;">
                            <div
                                style="width: 52px; height: 52px; background: #ffffff; border-radius: 8px; text-align: center; line-height: 52px; box-shadow: 0 4px 20px rgba(0,0,0,0.25);">
                                <img src="../benz-packaging.png" alt="Benz" width="40"
                                    style="display: inline-block; vertical-align: middle;">
                            </div>
                        </td>
                        <td style="padding-left: 18px; vertical-align: middle;">
                            <div
                                style="font-family: 'Quicksand', Arial, sans-serif; font-size: 16px; font-weight: 700; color: #ffffff; letter-spacing: 3px;">
                                BENZ PACKAGING</div>
                            <div
                                style="font-family: 'Quicksand', Arial, sans-serif; font-size: 9px; font-weight: 400; color: rgba(255,255,255,0.75); letter-spacing: 1px; margin-top: 2px;">
                                Protection Before Perfection</div>
                        </td>
                        <td style="text-align: right; vertical-align: middle;">
                            <div
                                style="font-family: 'Pinyon Script', cursive; font-size: 36px; color: #ffffff; line-height: 1; text-shadow: 0 3px 10px rgba(0,0,0,0.3);">
                                Merry Christmas
                            </div>
                            <div
                                style="font-family: 'Quicksand', Arial, sans-serif; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.9); letter-spacing: 2px; margin-top: 4px;">
                                &amp; HAPPY NEW YEAR <span
                                    style="background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 3px;">2025</span>
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>

</html>
