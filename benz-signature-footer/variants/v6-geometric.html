<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>V6 - Geometric Teal</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600&display=swap"
        rel="stylesheet">
</head>

<body style="margin: 0; padding: 30px; background: #1a1a2e; font-family: Arial, sans-serif;">

    <!-- GEOMETRIC: Angular shapes with teal -->
    <table cellpadding="0" cellspacing="0" border="0" style="width: 680px; background: #14b8a6; position: relative;">
        <tr>
            <td style="padding: 0;">
                <table cellpadding="0" cellspacing="0" border="0" width="100%">
                    <tr>
                        <!-- Left diagonal panel -->
                        <td style="width: 180px; background: #0f172a; padding: 22px 25px; vertical-align: middle;">
                            <img src="../benz-packaging.png" alt="Benz" width="50"
                                style="display: block; margin: 0 auto;">
                            <div
                                style="font-family: 'Archivo Black', Arial, sans-serif; font-size: 11px; color: #2dd4bf; text-align: center; margin-top: 8px; letter-spacing: 1px;">
                                BENZ</div>
                        </td>
                        <!-- Main teal content -->
                        <td style="padding: 22px 30px; vertical-align: middle;">
                            <table cellpadding="0" cellspacing="0" border="0" width="100%">
                                <tr>
                                    <td style="vertical-align: middle;">
                                        <div
                                            style="font-family: 'Archivo Black', Arial, sans-serif; font-size: 16px; color: #ffffff; letter-spacing: 2px;">
                                            BENZ PACKAGING</div>
                                        <div
                                            style="font-family: 'Space Grotesk', Arial, sans-serif; font-size: 9px; color: rgba(255,255,255,0.8); letter-spacing: 1px; margin-top: 3px;">
                                            Protection Before Perfection</div>
                                    </td>
                                    <td style="text-align: right; vertical-align: middle;">
                                        <div
                                            style="font-family: 'Space Grotesk', Arial, sans-serif; font-size: 14px; font-weight: 600; color: #0f172a;">
                                            ❄ Merry Christmas ❄
                                        </div>
                                        <div
                                            style="font-family: 'Archivo Black', Arial, sans-serif; font-size: 13px; color: #ffffff; margin-top: 4px;">
                                            HAPPY NEW YEAR 2025</div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>

</html>
