<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>V6 - Modern Grid</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body style="margin: 0; padding: 30px; background: #f5f5f5; font-family: Arial, sans-serif;">

    <table cellpadding="0" cellspacing="0" border="0"
        style="width: 650px; background: #ffffff; border: 1px solid #e5e5e5;">
        <tr>
            <td
                style="width: 70px; padding: 15px; border-right: 1px solid #e5e5e5; text-align: center; vertical-align: middle;">
                <img src="../benz-packaging.png" alt="Benz" width="55" style="display: block; margin: 0 auto;">
            </td>
            <td style="padding: 15px 20px; border-right: 1px solid #e5e5e5; vertical-align: middle;">
                <div
                    style="font-family: 'Roboto', Arial, sans-serif; font-size: 15px; font-weight: 700; color: #1a365d;">
                    BENZ PACKAGING</div>
                <div
                    style="font-family: 'Roboto', Arial, sans-serif; font-size: 10px; font-weight: 300; color: #2d8a5e; margin-top: 2px;">
                    Protection Before Perfection</div>
            </td>
            <td style="padding: 15px 20px; text-align: center; vertical-align: middle; background: #fafafa;">
                <div style="font-family: 'Roboto', Arial, sans-serif; font-size: 13px; font-weight: 500; color: #333;">
                    ❄ Merry Christmas &amp; Happy New Year ❄
                </div>
                <div
                    style="font-family: 'Roboto', Arial, sans-serif; font-size: 16px; font-weight: 700; color: #1a365d; margin-top: 3px;">
                    2025</div>
            </td>
        </tr>
    </table>

</body>

</html>
