<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>V7 - Eco Green</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body style="margin: 0; padding: 30px; background: #f5f5f5; font-family: Arial, sans-serif;">

    <table cellpadding="0" cellspacing="0" border="0"
        style="width: 650px; background: linear-gradient(to right, #f0fff4, #fff); border-left: 4px solid #22c55e;">
        <tr>
            <td style="padding: 16px 25px;">
                <table cellpadding="0" cellspacing="0" border="0" width="100%">
                    <tr>
                        <td style="width: 55px; vertical-align: middle;">
                            <img src="../benz-packaging.png" alt="Benz" width="50" style="display: block;">
                        </td>
                        <td style="padding-left: 18px; vertical-align: middle;">
                            <div
                                style="font-family: 'Poppins', Arial, sans-serif; font-size: 14px; font-weight: 700; color: #166534;">
                                BENZ PACKAGING</div>
                            <div
                                style="font-family: 'Poppins', Arial, sans-serif; font-size: 9px; font-weight: 500; color: #15803d;">
                                Protection Before Perfection</div>
                        </td>
                        <td style="text-align: center; vertical-align: middle;">
                            <span
                                style="display: inline-block; padding: 4px 10px; background: #dcfce7; border-radius: 3px; font-family: 'Poppins', Arial, sans-serif; font-size: 9px; color: #166534;">
                                ♻ Sustainable Packaging
                            </span>
                        </td>
                        <td style="text-align: right; vertical-align: middle;">
                            <div
                                style="font-family: 'Poppins', Arial, sans-serif; font-size: 13px; font-weight: 500; color: #166534;">
                                Merry Christmas &amp; Green New Year
                            </div>
                            <div
                                style="font-family: 'Poppins', Arial, sans-serif; font-size: 14px; font-weight: 700; color: #22c55e;">
                                2025</div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>

</html>
