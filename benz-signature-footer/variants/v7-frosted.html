<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>V7 - Frosted Glass</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body style="margin: 0; padding: 30px; background: #1a1a2e; font-family: Arial, sans-serif;">

    <!-- FROSTED GLASS on Teal -->
    <table cellpadding="0" cellspacing="0" border="0"
        style="width: 680px; background: linear-gradient(135deg, #0d9488 0%, #2dd4bf 100%); padding: 12px;">
        <tr>
            <td>
                <table cellpadding="0" cellspacing="0" border="0"
                    style="width: 100%; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); backdrop-filter: blur(10px);">
                    <tr>
                        <td style="padding: 18px 28px;">
                            <table cellpadding="0" cellspacing="0" border="0" width="100%">
                                <tr>
                                    <td style="width: 55px; vertical-align: middle;">
                                        <img src="../benz-packaging.png" alt="Benz" width="50" style="display: block;">
                                    </td>
                                    <td style="padding-left: 18px; vertical-align: middle;">
                                        <div
                                            style="font-family: 'Outfit', Arial, sans-serif; font-size: 18px; font-weight: 700; color: #ffffff; letter-spacing: 2px;">
                                            BENZ PACKAGING</div>
                                        <div
                                            style="font-family: 'Outfit', Arial, sans-serif; font-size: 10px; font-weight: 400; color: rgba(255,255,255,0.8); letter-spacing: 1px; margin-top: 2px;">
                                            Protection Before Perfection</div>
                                    </td>
                                    <td style="text-align: right; vertical-align: middle;">
                                        <div
                                            style="font-family: 'Outfit', Arial, sans-serif; font-size: 9px; color: rgba(255,255,255,0.7); letter-spacing: 2px;">
                                            ✧ SEASON'S GREETINGS ✧</div>
                                        <div
                                            style="font-family: 'Outfit', Arial, sans-serif; font-size: 17px; font-weight: 700; color: #ffffff; margin: 5px 0;">
                                            Merry Christmas</div>
                                        <div
                                            style="font-family: 'Outfit', Arial, sans-serif; font-size: 12px; font-weight: 600; color: #0f172a;">
                                            &amp; Happy New Year 2025</div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>

</html>
