<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body style="margin:0;padding:0;font-family:'Quicksand',Arial,sans-serif;">
    <table cellpadding="0" cellspacing="0" border="0"
        style="max-width:700px;background:linear-gradient(90deg,#f8fff8 0%,#fff 100%);border-radius:4px;">
        <tr>
            <td style="padding:12px 25px;">
                <table cellpadding="0" cellspacing="0" border="0" width="100%">
                    <tr>
                        <td style="width:50px;vertical-align:middle;">
                            <img src="https://ergopack.in/benz-logo.png" alt="Benz" style="height:38px;display:block;">
                        </td>
                        <td style="vertical-align:middle;padding-left:15px;">
                            <span style="font-size:14px;font-weight:600;color:#2d5016;">Benz Packaging</span>
                            <span style="font-size:10px;color:#4a7c23;display:block;margin-top:1px;">Protection Before
                                Perfection</span>
                        </td>
                        <td style="vertical-align:middle;text-align:center;padding:0 20px;">
                            <span
                                style="display:inline-block;background:#e8f5e9;padding:4px 12px;border-radius:12px;font-size:9px;color:#2d5016;text-transform:uppercase;letter-spacing:1px;">Eco-Friendly</span>
                        </td>
                        <td style="vertical-align:middle;text-align:right;">
                            <span style="font-size:12px;color:#4a7c23;">❄ Season's Greetings & Happy New Year 2025
                                ❄</span>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
