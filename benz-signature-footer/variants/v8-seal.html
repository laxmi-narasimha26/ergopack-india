<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
</head>

<body style="margin:0;padding:0;font-family:'Cormorant Garamond',Georgia,serif;">
    <table cellpadding="0" cellspacing="0" border="0" style="max-width:700px;background:#fff;">
        <tr>
            <td style="padding:10px 25px;border-top:1px solid #c9a227;border-bottom:1px solid #c9a227;">
                <table cellpadding="0" cellspacing="0" border="0" width="100%">
                    <tr>
                        <td style="width:55px;vertical-align:middle;">
                            <div
                                style="width:50px;height:50px;border:2px solid #c9a227;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;">
                                <img src="https://ergopack.in/benz-logo.png" alt="Benz" style="height:32px;">
                            </div>
                        </td>
                        <td style="vertical-align:middle;padding-left:15px;">
                            <span style="font-size:16px;font-weight:600;color:#1a3a5c;letter-spacing:1px;">BENZ
                                PACKAGING</span>
                            <span style="font-size:11px;color:#666;display:block;font-style:italic;">Protection Before
                                Perfection</span>
                        </td>
                        <td style="vertical-align:middle;text-align:right;">
                            <span style="font-size:13px;color:#c9a227;font-style:italic;">✧ Merry Christmas & Happy New
                                Year 2025 ✧</span>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
