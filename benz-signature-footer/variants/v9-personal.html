<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Open+Sans:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body style="margin:0;padding:0;font-family:'Open Sans',Arial,sans-serif;">
    <table cellpadding="0" cellspacing="0" border="0" style="max-width:700px;background:#fffdf8;">
        <tr>
            <td style="padding:12px 25px;border-left:3px solid #c9a227;">
                <table cellpadding="0" cellspacing="0" border="0" width="100%">
                    <tr>
                        <td style="width:45px;vertical-align:middle;">
                            <img src="https://ergopack.in/benz-logo.png" alt="Benz" style="height:36px;display:block;">
                        </td>
                        <td style="vertical-align:middle;padding-left:12px;">
                            <span style="font-size:14px;font-weight:500;color:#333;">Benz Packaging</span>
                            <span style="font-size:10px;color:#888;display:block;">Protection Before Perfection</span>
                        </td>
                        <td style="vertical-align:middle;text-align:right;">
                            <span style="font-family:'Caveat',cursive;font-size:18px;color:#c9a227;">Wishing you a Merry
                                Christmas & Happy 2025!</span>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
