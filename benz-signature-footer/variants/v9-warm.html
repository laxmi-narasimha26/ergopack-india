<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>V9 - Warm Handwritten</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Mulish:wght@400;600;700&display=swap"
        rel="stylesheet">
</head>

<body style="margin: 0; padding: 30px; background: #1a1a2e; font-family: Arial, sans-serif;">

    <!-- WARM with handwritten accent -->
    <table cellpadding="0" cellspacing="0" border="0"
        style="width: 680px; background: linear-gradient(135deg, #115e59 0%, #0d9488 100%);">
        <tr>
            <td style="padding: 20px 32px;">
                <table cellpadding="0" cellspacing="0" border="0" width="100%">
                    <tr>
                        <td style="width: 55px; vertical-align: middle;">
                            <div
                                style="width: 50px; height: 50px; background: #ffffff; border-radius: 6px; text-align: center; line-height: 50px;">
                                <img src="../benz-packaging.png" alt="Benz" width="38"
                                    style="display: inline-block; vertical-align: middle;">
                            </div>
                        </td>
                        <td style="padding-left: 18px; vertical-align: middle;">
                            <div
                                style="font-family: 'Mulish', Arial, sans-serif; font-size: 15px; font-weight: 700; color: #ffffff; letter-spacing: 2px;">
                                BENZ PACKAGING</div>
                            <div
                                style="font-family: 'Mulish', Arial, sans-serif; font-size: 9px; font-weight: 400; color: rgba(255,255,255,0.75); letter-spacing: 1px; margin-top: 2px;">
                                Protection Before Perfection</div>
                        </td>
                        <td style="text-align: right; vertical-align: middle;">
                            <div
                                style="font-family: 'Dancing Script', cursive; font-size: 30px; font-weight: 700; color: #ffffff; line-height: 1; text-shadow: 0 2px 10px rgba(0,0,0,0.3);">
                                Merry Christmas!
                            </div>
                            <div
                                style="font-family: 'Mulish', Arial, sans-serif; font-size: 11px; color: rgba(255,255,255,0.9); margin-top: 5px;">
                                With warm wishes &amp; a Happy New Year <span
                                    style="font-weight: 700; color: #ffffff;">2025</span>
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>

</html>
