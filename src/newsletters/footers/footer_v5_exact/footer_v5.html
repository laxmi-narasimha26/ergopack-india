<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logimat Marble Footer V5 - Exact Dark Panel</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: #000;
            padding: 40px;
            font-family: 'Lato', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .container {
            /* Generated Background v5 with dark panel */
            background-image: url('../../../../public/images/newsletter/marble_bg_v5.png');
            background-size: cover;
            background-position: center bottom;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .size-1200-400 {
            width: 1200px;
            height: 400px;
        }

        .content-left {
            width: 55%;
            padding-left: 60px;
            z-index: 10;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        .logo-benz {
            height: 50px;
            margin-bottom: 25px;
            filter: brightness(0) invert(1);
            display: block;
        }

        .title {
            font-family: 'Playfair Display', serif;
            color: white;
            font-size: 64px;
            line-height: 1;
            margin-bottom: 15px;
        }

        .highlight-text {
            color: #d1d5db;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 10px;
            display: block;
        }

        .date-loc {
            color: #f3f4f6;
            font-weight: 300;
            font-size: 18px;
            opacity: 0.9;
            padding-top: 10px;
        }

        .machine-container {
            width: 45%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            /* Center horizontally in right half */
            padding-right: 20px;
        }

        /* Machine alignment relative to the dark panel */
        .machine-img {
            height: 88%;
            /* Adjust to stand naturally on floor */
            width: auto;
            object-fit: contain;
            margin-bottom: 0px;
            /* The panel is "behind" automatically due to background-image */
            filter: drop-shadow(-15px 5px 25px rgba(0, 0, 0, 0.6));
            z-index: 10;
        }

        /* Booth Badge */
        .booth-badge {
            background-color: #E30613;
            color: white;
            position: absolute;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-align: left;
            bottom: 35px;
            right: 40px;
            padding: 15px 30px;
            z-index: 20;
        }

        .booth-badge span {
            font-size: 13px;
            display: block;
        }

        .booth-badge strong {
            font-size: 24px;
            display: block;
        }
    </style>
</head>

<body>

    <!-- 1200 x 400 -->
    <div class="container size-1200-400">
        <div class="content-left">
            <img src="../../../public/_email/benz-logo.png" class="logo-benz" alt="Benz Packaging">
            <span class="highlight-text">MEET US AT</span>
            <h1 class="title">LogiMAT India 2026</h1>
            <div class="date-loc">5-7 February 2026 | Bombay Exhibition Centre</div>
        </div>
        <div class="machine-container">
            <img src="../../eg/ergopack_machine.webp" class="machine-img" alt="Machine">
            <div class="booth-badge">
                <span>BOOTH</span>
                <strong>C09-07</strong>
            </div>
        </div>
    </div>

</body>

</html>
