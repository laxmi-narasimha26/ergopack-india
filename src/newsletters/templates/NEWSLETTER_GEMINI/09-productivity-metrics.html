<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light only">
    <title>Visualizing the Gap</title>
    <style type="text/css">
        :root {
            color-scheme: light only;
        }

        body,
        table,
        td {
            font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #F8F8F8;
        }

        .serif {
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .mono {
            font-family: 'Courier New', monospace;
        }

        @media screen and (max-width: 600px) {
            .mobile-full {
                width: 100% !important;
            }

            .mobile-pad {
                padding: 30px !important;
            }

            .stack {
                display: block !important;
                width: 100% !important;
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body style="margin: 0; padding: 0; background-color: #F8F8F8;">

    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: #F8F8F8;">
        <tr>
            <td align="center" style="padding: 40px 0;">

                <!-- MAIN CONTAINER -->
                <table role="presentation" cellpadding="0" cellspacing="0" width="600" class="mobile-full"
                    style="background-color: #ffffff; box-shadow: 0 5px 25px rgba(0,0,0,0.05);">

                    <!-- BRAND -->
                    <tr>
                        <td align="center" style="padding: 50px 0 40px 0;">
                            <img src="https://ergopack-india.com/images/logos/benz-logo.png" alt="Benz Packaging"
                                width="100" style="display: block;">
                        </td>
                    </tr>

                    <!-- HERO -->
                    <tr>
                        <td class="mobile-pad" style="padding: 0 60px 40px 60px; text-align: center;">
                            <h1 class="serif"
                                style="font-size: 38px; line-height: 1.1; color: #1a1a1a; margin: 0 0 20px 0; font-weight: 400;">
                                The Gap is Real.</h1>
                            <p style="font-size: 16px; line-height: 1.6; color: #666666; margin: 0;">
                                We compared 500 pallets strapped manually vs. ErgoPack. The results weren't close.
                            </p>
                        </td>
                    </tr>

                    <!-- METRIC BAR CHART -->
                    <tr>
                        <td style="padding: 0 40px 40px 40px;">
                            <div style="padding: 40px; background-color: #FAFAFA;">

                                <!-- ITEM 1: HOURS -->
                                <div style="margin-bottom: 30px;">
                                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                                        <span style="font-size: 13px; font-weight: 600; color: #1a1a1a;">Monthly Hours
                                            Required</span>
                                    </div>

                                    <!-- Manual -->
                                    <div style="margin-bottom: 8px;">
                                        <div
                                            style="background-color: #CCCCCC; width: 100%; height: 24px; line-height: 24px; color: #ffffff; font-size: 11px; padding-left: 10px; box-sizing: border-box;">
                                            1000 HOURS (MANUAL)</div>
                                    </div>
                                    <!-- ErgoPack -->
                                    <div>
                                        <div
                                            style="background-color: #1a1a1a; width: 25%; height: 24px; line-height: 24px; color: #ffffff; font-size: 11px; padding-left: 10px; box-sizing: border-box;">
                                            250 (ERGOPACK)</div>
                                    </div>
                                </div>

                                <!-- ITEM 2: FAILURES -->
                                <div style="margin-bottom: 10px;">
                                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                                        <span style="font-size: 13px; font-weight: 600; color: #1a1a1a;">Failures per
                                            500 Units</span>
                                    </div>

                                    <!-- Manual -->
                                    <div style="margin-bottom: 8px;">
                                        <div
                                            style="background-color: #CCCCCC; width: 80%; height: 24px; line-height: 24px; color: #ffffff; font-size: 11px; padding-left: 10px; box-sizing: border-box;">
                                            25 FAILURES</div>
                                    </div>
                                    <!-- ErgoPack -->
                                    <div>
                                        <div
                                            style="background-color: #1a1a1a; width: 2%; height: 24px; line-height: 24px; color: #ffffff; font-size: 11px; padding-left: 10px; box-sizing: border-box;">
                                        </div>
                                        <div
                                            style="font-size: 11px; color: #1a1a1a; margin-left: 5px; display: inline-block;">
                                            ~0</div>
                                    </div>
                                </div>

                            </div>
                        </td>
                    </tr>

                    <!-- CTA -->
                    <tr>
                        <td align="center" style="padding: 40px 60px 60px 60px;">
                            <a href="https://ergopack-india.com/roi-calculator"
                                style="border-bottom: 2px solid #1a1a1a; padding-bottom: 5px; color: #1a1a1a; text-decoration: none; font-size: 14px; font-weight: 600;">View
                                Full Productivity Report &rarr;</a>
                        </td>
                    </tr>

                    <!-- FOOTER -->
                    <tr>
                        <td align="center" style="padding: 0 60px 40px 60px; border-top: 1px solid #EEEEEE;">
                            <p style="margin-top: 40px; font-size: 12px; color: #999999; line-height: 1.6;">
                                Benz Packaging Solutions (P) Ltd.<br>
                                <a href="https://ergopack-india.com"
                                    style="color: #666666; text-decoration: none;">ergopack-india.com</a>
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>

</body>

</html>
